# cargo-audit configuration.
#
# `cargo audit` (and the CI advisory gate in
# `.github/workflows/audit.yml`) fails the build on any *vulnerability*.
# The advisories below are informational only (`unmaintained` /
# `unsound`) and are explicitly accepted: every one is a transitive
# dependency of the off-by-default `ui` feature's GTK3 desktop stack
# (egui / eframe / tray-icon / libappindicator) or a deep build-macro
# dependency with no upstream fix available. They cannot be resolved
# without a major upstream rewrite and carry no exploitable surface for
# a headless worker, so we acknowledge rather than suppress them.
#
# Review this list whenever the `ui` dependency tree is bumped: drop any
# entry that no longer appears in `cargo audit` output so a genuinely
# new advisory can never hide behind a stale ignore.
[advisories]
ignore = [
    "RUSTSEC-2024-0412", # gdk            — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0413", # atk            — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0415", # gtk            — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0416", # atk-sys        — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0418", # gdk-sys        — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0419", # gtk3-macros    — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0420", # gtk-sys        — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0429", # glib           — VariantStrIter unsoundness (ui)
    "RUSTSEC-2024-0370", # proc-macro-error — unmaintained build-macro dep
    "RUSTSEC-2024-0436", # paste          — unmaintained build-macro dep
    "RUSTSEC-2025-0119", # number_prefix  — unmaintained transitive dep
]
