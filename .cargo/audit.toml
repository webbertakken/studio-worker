# cargo-audit configuration.
#
# `cargo audit` (and the CI advisory gate in
# `.github/workflows/audit.yml`) fails the build on any *vulnerability*.
# The advisories below are informational only (`unmaintained` /
# `unsound`) and are explicitly accepted. Every one is a transitive
# dependency that lands in `Cargo.lock` but is never compiled into any
# artefact we ship:
#
#   - the GTK3 gtk-rs stack is `tray-icon`'s **Linux** backend, which we
#     no longer use — Linux drives the tray with `ksni` (pure Rust) and
#     `tray-icon` is a macOS/Windows-only dependency (native APIs, not
#     GTK).  `cargo audit` reads the lockfile (the union across every
#     target), so these appear even though no build links them.
#   - the `image-candle` feature's model stack
#     (candle / gemm build macros + hf-hub's progress-bar deps)
#
# None has an upstream fix available without a major rewrite, and none
# carries an exploitable surface here, so we acknowledge rather than
# suppress them.
#
# Review this list whenever the tray or `image-candle` dependency tree
# is bumped: drop any entry that no longer appears in `cargo audit`
# output so a genuinely new advisory can never hide behind a stale
# ignore.
[advisories]
ignore = [
    "RUSTSEC-2024-0412", # gdk            — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0413", # atk            — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0415", # gtk            — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0416", # atk-sys        — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0418", # gdk-sys        — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0419", # gtk3-macros    — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0420", # gtk-sys        — gtk-rs GTK3 bindings unmaintained (ui)
    "RUSTSEC-2024-0429", # glib           — VariantStrIter unsoundness (ui)
    "RUSTSEC-2024-0370", # proc-macro-error — glib-macros build macro (ui)
    "RUSTSEC-2024-0436", # paste          — candle/gemm build macro (image-candle)
    "RUSTSEC-2025-0119", # number_prefix  — hf-hub → indicatif dep (image-candle)
    # quick-xml quadratic-runtime parsing advisories.  quick-xml is
    # pulled only by the desktop-notification / tray stack
    # (tauri-winrt-notification → notify-rust, and zbus/muda), which
    # pin `^0.37` / `^0.39` — the fix (>=0.41) needs an upstream bump.
    # It is a `ui`-feature-only dependency and never parses untrusted
    # external XML in this worker, so there is no reachable DoS surface.
    # Drop these when notify-rust / the tray stack bump quick-xml.
    "RUSTSEC-2026-0194", # quick-xml      — UI notification/tray XML (ui)
    "RUSTSEC-2026-0195", # quick-xml      — UI notification/tray XML (ui)
    # zbus 6 folded zbus_names / zvariant / zvariant_derive into itself,
    # so the zbus 5 split crates are unmaintained.  ksni and notify-rust
    # (Linux tray + notifications) still require zbus 5 in their latest
    # releases.  Informational only, no vulnerability.  Drop these when
    # ksni and notify-rust move to zbus 6.
    "RUSTSEC-2026-0370", # zvariant        — zbus 5 split crate (ui)
    "RUSTSEC-2026-0371", # zbus_names      — zbus 5 split crate (ui)
    "RUSTSEC-2026-0372", # zvariant_derive — zbus 5 split crate (ui)
    # zip < 9 extraction flaws (SUID bits, symlink targets).  The worker
    # itself uses zip 9.  candle-core 0.11 (latest, `image-candle`, opt-in
    # and not shipped) still pins zip 8, and only reads `.npz` / pickle
    # archives with `by_name`; it never calls `extract`, the only
    # affected API.  Drop these when candle-core moves to zip 9.
    "RUSTSEC-2026-0367", # zip 8          — candle-core, extract only (image-candle)
    "RUSTSEC-2026-0368", # zip 8          — candle-core, extract only (image-candle)
    "RUSTSEC-2026-0369", # zip 8          — candle-core, extract only (image-candle)
]
