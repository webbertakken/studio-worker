name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default build is turnkey: UI + llama.cpp + onnx LaMa + media —
          # the exact `cargo install studio-worker` path (needs cmake/cc).
          - label: default-turnkey
            flags: ""
            fmt: true
          # Headless core (service / `run`), no UI deps.
          - label: headless
            flags: "--no-default-features"
            fmt: false
          # The fully-loaded release feature set: UI + in-process
          # llama.cpp + candle image + media.  Needs cmake (+ a C/C++
          # toolchain) for llama.cpp; clang for whisper isn't pulled here.
          - label: all-backends
            flags: "--features all"
            fmt: false
          # whisper static-links a second ggml that can't coexist with
          # llama's, so it ships in its own bundle — keep it compiling.
          # `--no-default-features` drops the now-turnkey default's llama so
          # the two ggml copies never collide at link time.
          - label: stt-backend
            flags: "--no-default-features --features all-engines-stt"
            fmt: false
    steps:
      - uses: actions/checkout@v6

      # The all-backends / stt-backend builds static-link candle +
      # whisper + llama (ggml), whose object files + the cache tarball
      # exhaust the runner's ~14 GB free disk.  Reclaim the ~25 GB of
      # preinstalled tooling we never use so the heavy matrix legs (and
      # their cache-save post-step) have headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Check formatting
        if: matrix.fmt
        run: cargo fmt --check

      - name: Run clippy (tests too)
        run: cargo clippy --tests ${{ matrix.flags }} -- -D warnings

      - name: Compile check
        run: cargo check ${{ matrix.flags }}

      - name: Run tests
        run: cargo test ${{ matrix.flags }}

  # The worker ships platform-specific code on three OSes (Windows
  # HKCU-\Run autostart via winreg, the scheduled-task XML, the launchd
  # plist, and the ExeReplaceGuard park/rename dance on real NTFS), but
  # the matrix above only runs on Linux.  Exercise the headless core
  # suite — which includes every one of those unit tests — on Windows +
  # macOS too.  `--no-default-features` drops llama.cpp (cmake) so these
  # legs stay fast and inside the free tier.
  cross-platform:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.os }}
      - name: Run tests (headless core)
        run: cargo test --no-default-features
