name: Publish to crates.io

# Publishes the crate to crates.io whenever a release tag is pushed, so
# `cargo install studio-worker` always tracks the latest release.  Runs
# alongside cargo-dist's `release.yml` (which builds the GitHub release
# binaries from the same tag).  Idempotent: skips a version already on
# crates.io, so re-runs and out-of-band manual publishes never fail it.

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io (skip if already published)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set; add a crates.io" \
                 "API token (publish scope) so releases can be published."
            exit 1
          fi
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "Releasing ${name} ${version}"
          published=$(curl -fsSL \
            -H 'User-Agent: studio-worker-release-ci' \
            "https://crates.io/api/v1/crates/${name}/${version}" \
            2>/dev/null | jq -r '.version.num // empty' || true)
          if [ "${published}" = "${version}" ]; then
            echo "${name} ${version} is already on crates.io; nothing to do."
            exit 0
          fi
          # --no-verify: the build is already validated by checks.yml +
          # release.yml on this same tag, and avoids needing cmake here.
          cargo publish --no-verify
