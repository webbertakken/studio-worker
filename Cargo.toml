[package]
name = "studio-worker"
version = "0.4.4"
edition = "2021"
description = "Pull-based image-generation worker for the minis.gg studio."
authors = ["Webber Takken"]
license = "MIT"
repository = "https://github.com/webbertakken/studio-worker"
homepage = "https://github.com/webbertakken/studio-worker"
readme = "README.md"
keywords = ["studio", "image-generation", "worker", "inference"]
categories = ["command-line-utilities"]

[[bin]]
name = "studio-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
# rustls instead of the default native-tls so a source build needs no
# OpenSSL dev headers on Linux (`cargo install studio-worker` must work
# on a bare box).  webpki-roots ships a baked CA bundle so we don't
# depend on the host trust store either.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "multipart",
    "rustls-tls-webpki-roots",
    "charset",
    "http2",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
hostname = "0.4"
whoami = "1.5"
sha2 = "0.10"
hex = "0.4"
# OS CSPRNG for the install id + registration secret.  Tiny syscall
# wrapper (getrandom(2) / BCryptGenRandom / getentropy), not the full
# `rand` crate; already in the tree transitively via rustls + sentry.
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
directories = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# rustls transport so Sentry doesn't drag OpenSSL into the build either.
sentry = { version = "0.48", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
sentry-tracing = "0.48"
parking_lot = "0.12"
url = "2.5"
chrono = { version = "0.4", features = ["clock", "serde"], default-features = false }
hound = "3.5.1"
semver = "1.0.28"
tempfile = "3"
# Unpack the stable-diffusion.cpp release zip when auto-provisioning
# `sd-cli`.  Pure-Rust deflate (miniz_oxide, already in the tree via
# sentry-backtrace) — no native libs, keeps `cargo install` on a bare
# box working.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Probe the Vulkan loader (libvulkan.so.1 / vulkan-1.dll) at runtime so a
# missing GPU runtime surfaces an actionable message instead of a
# cryptic sd-cli linker crash.  Tiny dlopen/LoadLibrary wrapper, no
# native libs.
libloading = "0.8"
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# Direct rustls dep so we can call `crypto::ring::default_provider`.
# rustls 0.23 stopped auto-picking a CryptoProvider from cargo
# features; the first wss/https handshake panics without an explicit
# `install_default`.  Pin to the same major as tokio-tungstenite's
# transitive copy so only one rustls ends up in the build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
thiserror = "2"
# Real-engine deps; each behind its own cargo feature so the default
# build stays small and CI stays fast.  (`llama-cpp-2` is Windows-gated
# below — see the note there.)
whisper-rs = { version = "0.14", optional = true, default-features = false }
candle-core = { version = "0.10.2", optional = true }
candle-nn = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", optional = true }
gif = { version = "0.13", optional = true }
# UI deps — gated behind the `ui` feature so headless installs stay
# free of GL / winit / dbus.  Default = off (see DECISIONS.md).
egui = { version = "0.34", optional = true, default-features = false }
eframe = { version = "0.34", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
notify-rust = { version = "4", optional = true }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }

# System tray, split per-OS so the Linux build stays free of GTK / cairo
# / appindicator (the pkg-config pain that broke `cargo install` on a
# bare box):
#   * macOS / Windows use `tray-icon` (native APIs, zero system deps).
#   * Linux uses `ksni` (pure-Rust StatusNotifierItem over zbus, no GTK).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.24", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true }

# Real autostart-on-login on Windows is an HKCU \Run registry value.
# winreg is a tiny pure-FFI wrapper over advapi32 (always present on
# Windows), so it's a plain target dep — no feature gate, no system libs.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

# In-process llama.cpp LLM — gated OFF Windows.  llama-cpp-2 0.1.x builds
# llama.cpp via cmake (which links the dynamic MSVC CRT and ignores
# CMAKE_MSVC_RUNTIME_LIBRARY), while the cc wrapper + Rust use the static
# CRT, so a release/LTO link fails with LNK2038 RuntimeLibrary mismatch +
# unresolved __imp_* CRT symbols.  Until that's fixable upstream, Windows
# release binaries ship without the in-process LLM (image via sd-cli +
# the other modalities still work); Linux + macOS keep it.  The `llama`
# feature's `dep:` edges below are simply inactive on Windows.
[target.'cfg(not(target_os = "windows"))'.dependencies]
llama-cpp-2 = { version = "0.1.124", optional = true, default-features = false }
encoding_rs = { version = "0.8", optional = true }

[features]
# UI on by default: `cargo install studio-worker` is windowed + tray and
# builds on a bare Linux box (rustls, no GTK, dlopen GL — no pkg-config).
default = ["ui"]
llama = ["dep:llama-cpp-2", "dep:encoding_rs"]
whisper = ["dep:whisper-rs"]
image-candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]
video = ["dep:gif"]
tts = []
# Desktop UI — brings in egui / eframe / tray-icon / notify-rust.
# Headless rigs and the systemd / launchd service path leave this off.
ui = [
    "dep:egui",
    "dep:eframe",
    "dep:notify-rust",
    "dep:rfd",
    # Per-OS tray backends (cargo activates the dep only on its target).
    "dep:tray-icon",
    "dep:ksni",
]
# Convenience bundles.  llama and whisper both statically link ggml.cpp,
# which currently can't coexist in the same binary on Linux (duplicate
# symbols).  Pick one bundle per build.
all-engines-llm = ["llama", "image-candle", "video", "tts"]
all-engines-stt = ["whisper", "image-candle", "video", "tts"]
# Fully-loaded source build: UI + every backend that can coexist in one
# binary (llama in-process + candle image + media).  whisper is excluded
# — it static-links a second ggml that clashes with llama's.  This is the
# feature set the cargo-dist release binaries are built with.
all = ["ui", "llama", "image-candle", "video", "tts"]

[dev-dependencies]
wiremock = "0.6"
# Build fake sd-cli release zips in the provisioning integration test.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
dirs = "6.0.0"
sentry = { version = "0.48", features = ["test"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# cargo-dist build profile
[profile.dist]
inherits = "release"
lto = "thin"

# cargo-dist configuration — drives the release pipeline.
[workspace.metadata.dist]
cargo-dist-version = "0.30.4"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Release binaries ship the full backend set so the install-script path
# is turnkey: UI (default) + in-process llama.cpp LLM + media engines.
# whisper is excluded — it static-links a second ggml that clashes with
# llama's; image stays sd-cli (subprocess) to avoid the same clash.
features = ["llama", "video", "tts"]
# PR checks run plan-only to catch issues early
pr-run-mode = "plan"

# System build deps cargo-dist installs on the release runners.
# llama-cpp-2 builds llama.cpp via cmake + a C/C++ toolchain.
[workspace.metadata.dist.dependencies.apt]
cmake = '*'

[workspace.metadata.dist.dependencies.homebrew]
cmake = '*'

[workspace.metadata.dist.dependencies.chocolatey]
cmake = '*'
