[package]
name = "studio-worker"
version = "0.2.2"
edition = "2021"
description = "Pull-based image-generation worker for the minis.gg studio."
authors = ["Webber Takken"]
license = "MIT"
repository = "https://github.com/webbertakken/studio-worker"
homepage = "https://github.com/webbertakken/studio-worker"
readme = "README.md"
keywords = ["studio", "image-generation", "worker", "gradio"]
categories = ["command-line-utilities"]

[[bin]]
name = "studio-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
hostname = "0.4"
whoami = "1.5"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
directories = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sentry = "0.48"
sentry-tracing = "0.48"
parking_lot = "0.12"
url = "2.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"], default-features = false }
hound = "3.5.1"
mp4 = "0.14.0"
semver = "1.0.28"
tempfile = "3"
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# Direct rustls dep so we can call `crypto::ring::default_provider`.
# rustls 0.23 stopped auto-picking a CryptoProvider from cargo
# features; the first wss/https handshake panics without an explicit
# `install_default`.  Pin to the same major as tokio-tungstenite's
# transitive copy so only one rustls ends up in the build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
thiserror = "2"
# Real-engine deps; each behind its own cargo feature so the default
# build stays small and CI stays fast.
llama-cpp-2 = { version = "0.1.124", optional = true, default-features = false }
whisper-rs = { version = "0.14", optional = true, default-features = false }
encoding_rs = { version = "0.8", optional = true }
candle-core = { version = "0.10.2", optional = true }
candle-nn = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", optional = true }
gif = { version = "0.13", optional = true }
# UI deps — gated behind the `ui` feature so headless installs stay
# free of GL / winit / dbus.  Default = off (see DECISIONS.md).
egui = { version = "0.34", optional = true, default-features = false }
eframe = { version = "0.34", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
tray-icon = { version = "0.24", optional = true }
notify-rust = { version = "4", optional = true }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }
# tray-icon on Linux needs gtk::init() called on the same thread that
# runs its event loop; pulling gtk in directly is the cleanest way to
# call into that.  Non-Linux targets don't need it.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[features]
default = []
llama = ["dep:llama-cpp-2", "dep:encoding_rs"]
whisper = ["dep:whisper-rs"]
image-candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]
video = ["dep:gif"]
tts = []
# Desktop UI — brings in egui / eframe / tray-icon / notify-rust.
# Headless rigs and the systemd / launchd service path leave this off.
ui = [
    "dep:egui",
    "dep:eframe",
    "dep:tray-icon",
    "dep:notify-rust",
    "dep:gtk",
    "dep:rfd",
]
# Convenience bundles.  llama and whisper both statically link ggml.cpp,
# which currently can't coexist in the same binary on Linux (duplicate
# symbols).  Pick one bundle per build.
all-engines-llm = ["llama", "image-candle", "video", "tts"]
all-engines-stt = ["whisper", "image-candle", "video", "tts"]

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
dirs = "6.0.0"
sentry = { version = "0.48", features = ["test"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# cargo-dist build profile
[profile.dist]
inherits = "release"
lto = "thin"

# cargo-dist configuration — drives the release pipeline.
[workspace.metadata.dist]
cargo-dist-version = "0.30.4"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# PR checks run plan-only to catch issues early
pr-run-mode = "plan"
