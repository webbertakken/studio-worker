# cargo-deny configuration — licence + supply-chain gate.
#
# `cargo audit` (see .github/workflows/audit.yml) already owns the
# security-advisory gate; cargo-deny here adds a *licence* allow-list
# (so a new dependency under a copyleft / unknown licence trips CI) and
# a duplicate-version report.  Advisories are left to cargo-audit, so
# this file's `advisories` section is intentionally lenient.

[graph]
# Evaluate the union across every target the worker builds for, so a
# platform-specific dependency's licence is still checked.
all-features = true

[licenses]
# Every licence present in the tree today is either permissive or a
# file-level / font copyleft that does not reach our own code.  A new
# dependency under anything else fails the check until it's reviewed and
# added here deliberately.
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Weak / file-level copyleft that doesn't affect our source:
    "MPL-2.0",
    # Bundled default fonts in epaint:
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[[licenses.exceptions]]
# self_cell is offered under GPL-2.0 OR a permissive licence; pin the
# crate so the GPL option can't silently apply to anything else.
name = "self_cell"
allow = ["MIT", "Apache-2.0"]

[bans]
# The GUI + engine trees legitimately pull several major versions of
# windows-sys / bitflags / etc.  Report duplicates (so churn is
# visible) without failing the build on them.
multiple-versions = "warn"
wildcards = "allow"

[advisories]
# Owned by cargo-audit; keep cargo-deny quiet here so the two don't
# double-report.
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
